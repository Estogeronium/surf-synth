<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SURF — прибой</title>
  <meta name="description" content="Синтезатор шума морского прибоя: включите и настройте волны.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f6f6f3'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2300cfc1'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #e9ebea;
      --ink: #3c4144;
      --ink-soft: #6d7377;
      --accent: #00cfc1;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(120% 90% at 50% 40%, #f4f5f4 0%, var(--bg) 70%);
      color: var(--ink);
      font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    .intro { flex: none; padding: 18px 24px 4px; text-align: center; }
    .intro h1 { margin: 0; font-size: 15px; letter-spacing: .38em; text-indent: .38em; font-weight: 700; color: var(--ink); }
    .intro p { margin: 6px auto 0; max-width: 640px; color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
    .intro p b { color: var(--ink); font-weight: 600; }
    .stage { flex: 1; min-height: 0; position: relative; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .bar {
      flex: none; position: relative; z-index: 5; display: flex; align-items: center; justify-content: center;
      padding: 10px 16px 14px; gap: 12px 24px; flex-wrap: wrap;
      font-size: 12px; letter-spacing: .03em; color: var(--ink-soft);
    }
    .credit { color: var(--ink); }
    .credit a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; }
    .credit a:hover, .credit a:focus-visible { color: #00867d; }
    @media (min-width: 861px) { .credit { position: absolute; right: 24px; } }
    @media (max-width: 640px) {
      .intro { padding: 12px 16px 0; }
      .intro p { font-size: 12px; }
    }

    /* ---- inside view ---- */
    .view-toggle {
      display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px;
      background: rgba(255,255,255,.72); border: 1px solid #d5d9d8;
    }
    .view-toggle button {
      font: inherit; font-size: 13px; letter-spacing: .02em; color: var(--ink-soft);
      border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer;
    }
    .view-toggle button[aria-pressed="true"] { background: var(--accent); color: #05302d; font-weight: 600; }
    .view-toggle button:focus-visible, .panel button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .panel {
      flex: none; height: clamp(260px, 40vh, 420px); z-index: 4;
      background: #fbfbf8; border-top: 1px solid #d5d9d8; display: flex; flex-direction: column;
      font-size: 13px; color: var(--ink);
    }
    .panel[hidden] { display: none; }
    .tabs { display: flex; align-items: center; gap: 4px; padding: 4px 16px 0; border-bottom: 1px solid #e1e4e3; }
    .tabs button { font: inherit; border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent; }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
    .tabs .xray { margin-left: auto; font-size: 12px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .tabpane { overflow: auto; padding: 14px 24px 28px; width: 100%; max-width: 1100px; margin: 0 auto; flex: 1; min-height: 0; }
    .tabpane[hidden] { display: none; }
    .summary { color: var(--ink-soft); margin-bottom: 10px; line-height: 1.45; }
    .panel h3 { font-size: 14px; margin: 18px 0 6px; letter-spacing: .02em; }
    .panel h4 { margin: 18px 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
    .panel p, .panel li { line-height: 1.5; }
    .panel ol, .panel ul { padding-left: 20px; margin: 6px 0; }
    .panel code { font-size: 12px; background: #eef0ee; padding: 1px 4px; border-radius: 3px; }
    .line { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #eceeed; border-radius: 4px; cursor: default; }
    .line.flash { background: rgba(0,207,193,.16); }
    .line .qty { font-variant-numeric: tabular-nums; color: var(--ink-soft); text-align: right; }
    .line .d span { display: block; }
    .line .d small { color: var(--ink-soft); display: block; margin-top: 1px; }
    .refs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chip { font: inherit; font-size: 11px; font-variant-numeric: tabular-nums; padding: 2px 7px; border-radius: 999px; border: 1px solid #cfd5d4; background: #fff; cursor: pointer; color: var(--ink); }
    .chip:hover { border-color: var(--accent); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #05302d; font-weight: 600; }
    .card-slot:empty { display: none; }
    .part-card { border: 1px solid #cfd5d4; border-radius: 8px; padding: 10px 12px; background: #fff; margin-bottom: 12px; }
    .part-head { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
    .part-head span { color: var(--ink-soft); font-size: 13px; }
    .part-card p { margin: 6px 0 0; }
    .meta { color: var(--ink-soft); font-size: 12px; }
    table.pins { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    table.pins th { text-align: left; font-weight: 600; color: var(--ink-soft); padding: 3px 6px 3px 0; }
    table.pins td { padding: 3px 6px 3px 0; border-top: 1px solid #eceeed; vertical-align: top; }
    table.pins td.to { color: var(--ink-soft); }
    table.pins td.nc { color: var(--ink-soft); font-style: italic; }
    .extra { list-style: none; padding: 0; }
    .extra li { padding: 7px 0; border-bottom: 1px solid #eceeed; }
    .extra span { color: var(--ink-soft); }
    .sheetbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .sheetbar button { font: inherit; border: 1px solid #cfd5d4; background: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .sheetbar button[aria-pressed="true"] { border-color: var(--accent); background: rgba(0,207,193,.14); }
    .sheetbar .zoom { margin-left: auto; display: flex; gap: 4px; }
    .sheetview { overflow: auto; border: 1px solid #e1e4e3; border-radius: 6px; background: #fbfbf8; max-height: calc(40vh - 120px); }
    .sheetview svg { display: block; max-width: none; }
    .blocks { overflow-x: auto; border: 1px solid #e1e4e3; border-radius: 6px; margin: 8px 0; }
    .blocks svg { width: 920px; height: auto; display: block; }
    .net { display: grid; grid-template-columns: 108px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eceeed; align-items: baseline; }
    .net span { color: var(--ink-soft); font-size: 12px; line-height: 1.5; }
    .netname { font: inherit; font-weight: 600; font-size: 12px; text-align: left; padding: 3px 8px; border-radius: 999px; border: 1px solid #cfd5d4; background: #fff; cursor: pointer; }
    .netname:hover { border-color: var(--accent); }
    .chk { color: #8a6d00; }
    .panel a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 2px; }
    .tip { position: fixed; z-index: 6; pointer-events: none; background: #2b3033; color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 6px; max-width: 260px; line-height: 1.35; }
    .tip small { color: #aeb6b9; display: block; }
    @media (max-width: 860px) {
      .panel { height: 46vh; }
      .tabpane { padding: 12px 16px 24px; }
      .tabs { overflow-x: auto; }
      .sheetview { max-height: calc(46vh - 130px); }
    }

    /* Real controls: always present for keyboard and screen readers. */
    .controls {
      position: fixed; left: 0; top: 0; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .controls label { display: block; }
    /* No WebGL: show the plain controls instead. */
    .no-webgl #stage { display: none; }
    .no-webgl .controls {
      position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal;
      max-width: 360px; margin: 12vh auto 0; padding: 0 16px;
    }
    .no-webgl .controls label { margin: 0 0 18px; font-weight: 600; letter-spacing: .08em; }
    .no-webgl .controls input { display: block; width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
    .no-webgl .controls input[type=checkbox] { width: 22px; height: 22px; }
    .no-webgl .bar .view-toggle { display: none; }
    .no-webgl .stage { display: none; }
  </style>
</head>
<body>
  <header class="intro">
    <h1>SURF</h1>
    <p>Проект прибоя для фокусировки, отдыха и комфортного сна. Включите шум моря прямо на этой странице — или соберите устройство самостоятельно: нажмите «Внутри», там схема, список деталей и инструкция по сборке.</p>
  </header>
  <main class="stage"><canvas id="stage" aria-hidden="true"></canvas></main>
  <div class="tip" hidden></div>

  <form class="controls" aria-label="Управление синтезатором прибоя" onsubmit="return false">
    <label>Питание <input id="power" type="checkbox"></label>
    <label>Прибой <input id="surf" type="range" min="0" max="1" step="0.01"></label>
    <label>Прилив <input id="tide" type="range" min="0" max="1" step="0.01"></label>
    <label>Тембр <input id="tone" type="range" min="0" max="1" step="0.01"></label>
    <label>Громкость <input id="volume" type="range" min="0" max="1" step="0.01"></label>
  </form>

  <footer class="bar">
    <div class="view-toggle" role="group" aria-label="Вид устройства">
      <button type="button" data-view="front" aria-pressed="true">Снаружи</button>
      <button type="button" data-view="inside" aria-pressed="false">Внутри</button>
    </div>
    <span class="credit">Женя Звягин &middot; <a href="https://vonzvyagin.ru" target="_blank" rel="noopener">vonzvyagin.ru</a></span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
