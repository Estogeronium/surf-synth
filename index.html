<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surf Synth</title>
  <meta name="description" content="Pink-noise ocean surf synthesizer. Turn it on and shape the waves.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f6f6f3'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2300cfc1'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #e9ebea;
      --ink: #3c4144;
      --ink-soft: #6d7377;
      --accent: #00cfc1;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(120% 90% at 50% 40%, #f4f5f4 0%, var(--bg) 70%);
      color: var(--ink);
      font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .caption {
      position: fixed; left: 16px; right: 16px; bottom: 14px;
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 12px; letter-spacing: .04em; color: var(--ink-soft);
      pointer-events: none;
    }
    .caption b { color: var(--ink); letter-spacing: .14em; font-weight: 600; }

    /* Real controls: always present for keyboard and screen readers. */
    .controls {
      position: fixed; left: 0; top: 0; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .controls label { display: block; }
    /* No WebGL: show the plain controls instead. */
    .no-webgl #stage { display: none; }
    .no-webgl .controls {
      position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal;
      max-width: 360px; margin: 12vh auto 0; padding: 0 16px;
    }
    .no-webgl .controls label { margin: 0 0 18px; font-weight: 600; letter-spacing: .08em; }
    .no-webgl .controls input { display: block; width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
    .no-webgl .controls input[type=checkbox] { width: 22px; height: 22px; }
    .no-webgl .caption { display: none; }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <form class="controls" aria-label="Surf Synth controls" onsubmit="return false">
    <label>Power <input id="power" type="checkbox"></label>
    <label>Surf <input id="surf" type="range" min="0" max="1" step="0.01"></label>
    <label>Tide <input id="tide" type="range" min="0" max="1" step="0.01"></label>
    <label>Tone <input id="tone" type="range" min="0" max="1" step="0.01"></label>
    <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01"></label>
  </form>

  <p class="caption"><span><b>SURF</b> &nbsp;pink noise ocean</span><span>drag knobs &middot; shift = fine</span></p>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
